        - "/data/.config/plasmawindowed-appletsrc"
        - "/data/.config/plasmawindowedrc"
        - "/data/.config/powerdevil.notifyrc"
        - "/data/.config/powerdevilrc"
        - "/data/.config/powermanagementprofilesrc"
        - "/data/.config/sddmthemeinstallerrc"
        - "/data/.config/sealert.conf"
        - "/data/.config/specialmailcollectionsrc"
        - "/data/.config/spectaclerc"
        - "/data/.config/systemmonitorrc"
        - "/data/.config/systemsettingsrc"
        - "/data/.config/trashrc"
        - "/data/.config/user-dirs.dirs"
        - "/data/.config/user-dirs.locale"
        - "/data/.config/webengineurlinterceptoradblockrc"
        - "/data/.config/xdg-desktop-portal-kderc"
        - "/data/.config/xdg-terminals.list"

        # ----- 6. 用户保留的应用配置 (白名单应用) -----
        - "/data/.config/fcitx5"
        - "/data/.config/kitty"
        - "/data/.config/htop"
        - "/data/.config/gh"
        - "/data/.config/sunshine"
        - "/data/.config/rustdesk"
        - "/data/.config/qBittorrent"
        - "/data/.config/mpv"
        - "/data/.config/vlc"
        - "/data/.config/yin_yang"

        # ----- 7. 浏览器基础配置 (配合排除规则剔除庞大缓存与扩展二进制) -----
        - "/data/.config/BraveSoftware"
        - "/data/.mozilla/firefox"

      exclude:
        # ===== 浏览器轻量化 (剔除白名单浏览器内的扩展二进制、网页缓存、临时数据库) =====
        - "**/Extensions/**"
        - "**/extensions/**"
        - "**/extension-store/**"
        - "**/*.xpi"
        - "**/Local Extension Settings/**"
        - "**/Sync Extension Settings/**"
        - "**/Extension Rules/**"
        - "**/Extension Scripts/**"
        - "**/Extension State/**"
        - "**/component*crx_cache/**"
        - "**/extensions_crx_cache/**"
        - "**/WidevineCdm/**"
        - "**/gmp-widevinecdm/**"
        - "**/Safe Browsing/**"
        - "**/CertificateRevocation/**"
        - "**/Crowd Deny/**"
        - "**/SafetyTips/**"
        - "**/hyphen-data/**"
        - "**/MEIPreload/**"
        - "**/PKIMetadata/**"
        - "**/SSLErrorAssistant/**"
        - "**/ZxcvbnData/**"
        - "**/OnDeviceHeadSuggestModel/**"
        - "**/FileTypePolicies/**"
        - "**/Webstore Downloads/**"
        - "**/segmentation_platform/**"
        - "**/Local Storage/**"
        - "**/Session Storage/**"
        - "**/WebStorage/**"
        - "**/blob_storage/**"
        - "**/Shared Dictionary/**"
        - "**/shared_proto_db/**"
        - "**/Site Characteristics Database/**"
        - "**/*_db/**"
        - "**/*_cache/**"
        - "**/Dawn*/**"
        - "**/tor/**"
        - "**/BraveWallet/**"
        - "**/ads_service/**"
        - "**/AdBlock*/**"
        - "**/Dictionaries/**"
        - "**/AutofillStrikeDatabase/**"
        - "**/BudgetDatabase/**"
        - "**/GCM Store/**"
        - "**/Platform Notifications/**"
        - "**/VideoDecodeStats/**"
        - "**/Sync Data/**"
        - "**/ClientCertificates/**"
        - "*/Brave-Browser/[a-p][a-p]*/**"
        - "**/firefox-bak*/**"
        - "**/cache2/**"
        - "**/startupCache/**"
        - "**/jumpListCache/**"
        - "**/storage/**"
        - "**/entries/**"
        - "**/crashes/**"
        - "**/minidumps/**"
        - "**/saved-telemetry-pings/**"
        - "**/datareporting/**"
        - "**/weave/**"
        - "**/PersonalityProvider/**"
        - "**/security_state/**"
        - "**/Pending Pings/**"
        - "**/Profile Groups/**"

        # ===== 通用缓存、临时文件、密钥与日志过滤 =====
        - "**/[cC]ache/**"
        - "**/[cC]aches/**"
        - "**/GPUCache/**"
        - "**/Code Cache/**"
        - "**/Crashpad/**"
        - "**/Crash Reports/**"
        - "**/Service Worker/**"
        - "**/File System/**"
        - "**/IndexedDB/**"
        - "**/.cache/**"
        - "**/.Trash*/**"
        - "**/Trash/**"
        - "**/tmp/**"
        - "**/*.tmp"
        - "**/*.log"
        - "**/*.swp"
        - "**/*~"
        - "**/*.zip"
        - "**/*.tar*"
        - "**/*.pma"
        - "**/*.old"
        - "**/LOCK"
        - "**/LOG"
        - "**/LOG.old"
        - "**/node_modules/**"
        - "**/.git/**"
        - "**/.ssh/id_*"
        - "**/.ssh/*_key"
        - "**/.ssh/*.pem"
        - "**/*.so*"
        - "**/*.dll"
        - "**/*.exe"
        - "**/*.bin"
        - "**/*.mp3"
        - "**/*.mp4"
        - "**/*.wav"

      # 单文件大小上限拦截（任何超过 25MB 的非配置大文件自动排除）
      exclude-larger-than: "25M"
      exclude-caches: true
      one-file-system: false
      schedule: "*:00,30"
      schedule-permission: system

    retention:
      after-backup: true
      path: false
      keep-within: 48h
      keep-daily: 7
      keep-weekly: 4
      keep-monthly: 6
      prune: true
