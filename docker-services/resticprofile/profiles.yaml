        - "/data/.config/kmenueditrc"
        - "/data/.config/kminesrc"
        - "/data/.config/kmixrc"
        - "/data/.config/kmousetoolrc"
        - "/data/.config/kmplayerrc"
        - "/data/.config/knfsshare"
        - "/data/.config/knighttimerc"
        - "/data/.config/koirc"
        - "/data/.config/kolourpaintrc"
        - "/data/.config/konsole.notifyrc"
        - "/data/.config/konsolerc"
        - "/data/.config/konsolesshconfig"
        - "/data/.config/konversationrc"
        - "/data/.config/korganizerrc"
        - "/data/.config/kpatrc"
        - "/data/.config/krdpserverrc"
        - "/data/.config/krfbrc"
        - "/data/.config/kritadisplayrc"
        - "/data/.config/kritarc"
        - "/data/.config/krunnerrc"
        - "/data/.config/kscreenlockerrc"
        - "/data/.config/ksmserverrc"
        - "/data/.config/ktimezonedrc"
        - "/data/.config/kuriikwsfilterrc"
        - "/data/.config/kwalletrc"
        - "/data/.config/kwinoutputconfig.json"
        - "/data/.config/kwinrc"
        - "/data/.config/kwinrulesrc"
        - "/data/.config/kwritemetainfos"
        - "/data/.config/kwriterc"
        - "/data/.config/kxkbrc"
        - "/data/.config/lattedockrc"
        - "/data/.config/mimeapps.list"
        - "/data/.config/okularpartrc"
        - "/data/.config/okularrc"
        - "/data/.config/partitionmanagerrc"
        - "/data/.config/phishingurlrc"
        - "/data/.config/pimpluginsrc"
        - "/data/.config/plasma-localerc"
        - "/data/.config/plasma-org.kde.plasma.desktop-appletsrc"
        - "/data/.config/plasma-welcomerc"
        - "/data/.config/plasma.emojierrc"
        - "/data/.config/plasma_calendar_alternatecalendar"
        - "/data/.config/plasma_calendar_holiday_regions"
        - "/data/.config/plasmanotifyrc"
