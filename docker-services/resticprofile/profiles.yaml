version: "2"

global:
  scheduler: crond
  restic-stale-lock-age: 45m

profiles:
  default:
    repository: "rclone:gdrive:"
    password-file: "/etc/resticprofile/key"
    initialize: false
    force-inactive-lock: true
    restic-lock-retry-after: 1m

    env:
      RCLONE_CONFIG: "/etc/resticprofile/rclone/rclone.conf"
      RCLONE_DRIVE_USE_TRASH: "false"
      RCLONE_VERBOSE: "1"

    backup:
      verbose: true
      # ===== 白名单配置：仅备份明确指定的配置文件与轻量目录 =====
      source:
        # ----- 1. Shell 与终端基础配置文件 -----
        - "/data/.bashrc"
        - "/data/.bash_profile"
        - "/data/.zshrc"
        - "/data/.zshenv"
        - "/data/.zsh-proxy"
        - "/data/.oh-my-zsh/custom"
        - "/data/.tmux.conf"

        # ----- 2. Git 与 SSH 基础配置 (密钥由排除规则自动拦截) -----
        - "/data/.gitconfig"
        - "/data/.ssh/config"
        - "/data/.ssh/known_hosts"

        # ----- 3. KDE 桌面核心外观与窗口组件 (~/.local/share) -----
        - "/data/.local/share/plasma"
        - "/data/.local/share/color-schemes"
        - "/data/.local/share/konsole"
        - "/data/.local/share/kwin"
        - "/data/.local/share/kxmlgui5"
        - "/data/.local/share/plasma_notes"
        - "/data/.local/share/plasma-systemmonitor"

        # ----- 4. KDE 桌面核心环境与系统服务配置目录 (~/.config) -----
        - "/data/.config/autostart"
        - "/data/.config/environment.d"
        - "/data/.config/fontconfig"
        - "/data/.config/gtk-3.0"
        - "/data/.config/gtk-4.0"
        - "/data/.config/kate"
        - "/data/.config/KDE"
        - "/data/.config/kdeconnect"
        - "/data/.config/kdedefaults"
        - "/data/.config/kde.org"
        - "/data/.config/klassy"
        - "/data/.config/konsave"
        - "/data/.config/latte"
        - "/data/.config/menus"
        - "/data/.config/plasma-workspace"
        - "/data/.config/session"
        - "/data/.config/systemd"
        - "/data/.config/xsettingsd"

        # ----- 5. KDE 桌面与系统根级单个配置文件 (~/.config/*) -----
        - "/data/.config/.qmlformat.ini"
        - "/data/.config/KDE-xdg-terminals.list"
        - "/data/.config/Oliverc"
        - "/data/.config/PlasmaDiscoverUpdates"
        - "/data/.config/QtProject.conf"
        - "/data/.config/Shotcutrc"
        - "/data/.config/Trolltech.conf"
        - "/data/.config/akonadi-firstrunrc"
        - "/data/.config/akonadi-migrationrc"
        - "/data/.config/akonadi_akonotes_resource_0rc"
        - "/data/.config/akonadi_contacts_resource_0rc"
        - "/data/.config/akonadi_ical_resource_0rc"
        - "/data/.config/akonadi_indexing_agentrc"
        - "/data/.config/akonadi_maildir_resource_0rc"
        - "/data/.config/akregatorrc"
        - "/data/.config/arkrc"
        - "/data/.config/baloofileinformationrc"
        - "/data/.config/baloofilerc"
        - "/data/.config/bluedevilglobalrc"
        - "/data/.config/breezerc"
        - "/data/.config/defaultcalendarrc"
        - "/data/.config/discoverrc"
        - "/data/.config/dnfdragora.yaml"
        - "/data/.config/dolphinrc"
        - "/data/.config/dragonplayerrc"
        - "/data/.config/drkonqirc"
        - "/data/.config/elisarc"
        - "/data/.config/emaildefaults"
        - "/data/.config/emailidentities"
        - "/data/.config/eventviewsrc"
        - "/data/.config/fcitx5-qt5-gui-wrapperrc"
        - "/data/.config/fedora-plasma-cacherc"
        - "/data/.config/filetypesrc"
        - "/data/.config/gtkrc"
        - "/data/.config/gtkrc-2.0"
        - "/data/.config/gwenviewrc"
        - "/data/.config/kactivitymanagerd-statsrc"
        - "/data/.config/kactivitymanagerdrc"
        - "/data/.config/kalendaracrc"
        - "/data/.config/kate-externaltoolspluginrc"
        - "/data/.config/katemetainfos"
        - "/data/.config/katerc"
        - "/data/.config/kateschemarc"
        - "/data/.config/katevirc"
        - "/data/.config/kcalcrc"
        - "/data/.config/kcmfonts"
        - "/data/.config/kcminputrc"
        - "/data/.config/kconf_updaterc"
        - "/data/.config/kdebugrc"
        - "/data/.config/kded5rc"
        - "/data/.config/kdeglobals"
        - "/data/.config/kfontinstuirc"
        - "/data/.config/kglobalshortcutsrc"
        - "/data/.config/khelpcenterrc"
        - "/data/.config/khotkeysrc"
        - "/data/.config/kinfocenterrc"
        - "/data/.config/kiorc"
        - "/data/.config/kioslaverc"
        - "/data/.config/klanguageoverridesrc"
        - "/data/.config/klassyrc"
        - "/data/.config/klipperrc"
        - "/data/.config/kmagrc"
        - "/data/.config/kmahjonggrc"
